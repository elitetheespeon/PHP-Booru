<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/project/html

    <Directory /var/www/project/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

